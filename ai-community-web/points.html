<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>點數紀錄 - Aî 智慧社區</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/orders.css">
  <style>
    .points-summary { text-align: center; padding: 24px 16px; }
    .points-total { font-size: 36px; font-weight: bold; color: #4CAF50; }
    .points-label { font-size: 13px; color: #666; margin-top: 4px; }
    .points-list { padding: 0 16px; }
    .points-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: #fff; border-radius: 10px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .points-item-left { display: flex; flex-direction: column; }
    .points-item-name { font-size: 14px; font-weight: 500; color: #333; }
    .points-item-status { font-size: 12px; color: #999; margin-top: 2px; }
    .points-item-right { font-size: 14px; font-weight: bold; }
    .points-plus { color: #4CAF50; }
    .points-zero { color: #999; }
    .points-hint { font-size: 11px; color: #FF9800; margin-left: 6px; }
  </style>
</head>
<body>
<div class="page-wrapper">
  <!-- Header -->
  <div class="page-header">
    <span class="header-back" onclick="history.back()">←</span>
    <span class="header-title">點數紀錄</span>
    <span></span>
  </div>

  <!-- 頁面內容 -->
  <div class="page-content">
    <!-- 總點數 -->
    <div class="card">
      <div class="points-summary">
        <div class="points-total" id="points-total">0 P</div>
        <div class="points-label">累積點數（完成訂單每筆 +5 點）</div>
      </div>
    </div>

    <!-- 點數明細 -->
    <div style="margin-top:12px;">
      <h3 class="section-title" style="padding:0 16px;">點數明細</h3>
      <div class="points-list" id="points-list">
        <div class="loading">載入中...</div>
      </div>
    </div>
  </div>

  <!-- 底部導覽列 -->
  <nav class="nav-bar">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span>首頁</span>
    </a>
    <a href="services.html" class="nav-item">
      <span class="nav-icon">🛎️</span>
      <span>服務</span>
    </a>
    <a href="orders.html" class="nav-item">
      <span class="nav-icon">📋</span>
      <span>訂單</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>我的</span>
    </a>
  </nav>
</div>

<!-- Scripts -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/crypto.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (!Auth.requireAuth()) return;

    const listEl = document.getElementById('points-list');
    const totalEl = document.getElementById('points-total');

    const result = await API.getOrders();

    if (!result || !result.success || !result.data || result.data.length === 0) {
      listEl.innerHTML = '<p style="text-align:center;color:#999;padding:40px 0;">目前沒有訂單紀錄</p>';
      totalEl.textContent = '0 P';
      return;
    }

    const orders = result.data;
    let totalPoints = 0;

    // 依時間排序（最新在前）
    orders.sort((a, b) => new Date(b.order_time) - new Date(a.order_time));

    const html = orders.map(order => {
      const isCompleted = order.order_status === '80';
      const isPending = ['01', '02', '03', '04'].includes(order.order_status);
      const points = isCompleted ? 5 : 0;
      const serviceName = order.service_name || order.vendor_name || '服務';

      if (isCompleted) totalPoints += 5;

      const statusLabel = CONFIG.ORDER_STATUS[order.order_status]
        ? CONFIG.ORDER_STATUS[order.order_status].label
        : '未知';

      const pointsDisplay = isCompleted
        ? '<span class="points-plus">+5 P</span>'
        : isPending
          ? '<span class="points-zero">0 P</span><span class="points-hint">完成訂單 +5</span>'
          : '<span class="points-zero">0 P</span>';

      return `
        <div class="points-item">
          <div class="points-item-left">
            <span class="points-item-name">${serviceName}（${order.order_no}）</span>
            <span class="points-item-status">${statusLabel} · ${Utils.formatDateTime ? Utils.formatDateTime(order.order_time) : order.order_time}</span>
          </div>
          <div class="points-item-right">
            ${pointsDisplay}
          </div>
        </div>
      `;
    }).join('');

    listEl.innerHTML = html;
    totalEl.textContent = totalPoints + ' P';
  });
</script>
</body>
</html>
