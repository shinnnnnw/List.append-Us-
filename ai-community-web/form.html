<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>服務表單 - Aî 智慧社區</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/form.css">
</head>
<body>
<div class="page-wrapper">
  <!-- Header -->
  <div class="page-header">
    <button class="header-back" onclick="history.back()">←</button>
    <span class="header-title">服務表單</span>
    <span></span>
  </div>

  <!-- 頁面內容 -->
  <div class="page-content form-container">
    <!-- 表單標題 -->
    <div id="form-header"></div>

    <!-- 注意事項 -->
    <div id="form-notice" class="form-notice hidden"></div>

    <!-- 表單內容（動態渲染） -->
    <div id="form-body">
      <div class="loading">載入表單中...</div>
    </div>

    <!-- 服務條款 -->
    <div id="form-terms" class="form-terms hidden"></div>
  </div>

  <!-- 送出按鈕 -->
  <div class="form-submit-bar">
    <button id="form-submit-btn" class="btn btn-primary btn-block">送出表單</button>
  </div>
</div>

<!-- Scripts -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/form-renderer.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    FormRenderer.init();
  });
</script>
</body>
</html>
