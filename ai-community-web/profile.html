<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人中心 - Aî 智慧社區</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/orders.css">
</head>
<body>
<div class="page-wrapper">
  <!-- Header -->
  <div class="page-header">
    <span class="header-title">個人中心</span>
    <span></span>
  </div>

  <!-- 頁面內容 -->
  <div class="page-content">
    <!-- 用戶頭像與名稱 -->
    <div class="profile-header">
      <div class="profile-avatar" id="profile-avatar">王</div>
      <div class="profile-name" id="profile-name">王小明</div>
      <div class="profile-points" id="profile-points">累積點數：50 P</div>
    </div>

    <!-- 功能選單 -->
    <div class="card">
      <ul class="profile-menu">
        <li class="profile-menu-item" onclick="Utils.navigate('orders.html')">
          <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:8px"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h4"/></svg>我的訂單</span>
          <span class="menu-arrow">→</span>
        </li>
        <li class="profile-menu-item" onclick="Utils.navigate('points.html')">
          <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:8px"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8"/></svg>點數紀錄</span>
          <span class="menu-arrow">→</span>
        </li>
        <li class="profile-menu-item" onclick="Utils.navigate('notifications.html')">
          <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:8px"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>通知設定</span>
          <span class="menu-arrow">→</span>
        </li>
        <li class="profile-menu-item" onclick="Utils.navigate('contact.html')">
          <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:8px"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>聯絡客服</span>
          <span class="menu-arrow">→</span>
        </li>
        <li class="profile-menu-item" onclick="Utils.navigate('about.html')">
          <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:8px"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>關於平台</span>
          <span class="menu-arrow">→</span>
        </li>
      </ul>
    </div>

    <!-- 帳號資訊 -->
    <div class="card" style="margin-top:12px">
      <h3 class="section-title" style="margin-top:0">帳號資訊</h3>
      <div id="profile-info">
        <div class="order-info-row">
          <span class="info-label">姓名</span>
          <span class="info-value" id="info-name">-</span>
        </div>
        <div class="order-info-row">
          <span class="info-label">手機</span>
          <span class="info-value" id="info-phone">-</span>
        </div>
        <div class="order-info-row">
          <span class="info-label">Email</span>
          <span class="info-value" id="info-email">-</span>
        </div>
      </div>
    </div>

    <!-- 登出按鈕 -->
    <button class="logout-btn" id="logout-btn">登出</button>
  </div>

  <!-- 底部導覽列 -->
  <nav class="nav-bar">
    <a href="index.html" class="nav-item">
      <span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 001 1h3m10-11v10a1 1 0 01-1 1h-3m-6 0v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg></span>
      <span>首頁</span>
    </a>
    <a href="services.html" class="nav-item">
      <span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg></span>
      <span>服務</span>
    </a>
    <a href="orders.html" class="nav-item">
      <span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h4"/></svg></span>
      <span>訂單</span>
    </a>
    <a href="profile.html" class="nav-item active">
      <span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 10-16 0"/></svg></span>
      <span>我的</span>
    </a>
  </nav>
</div>

<!-- Scripts -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/crypto.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (!Auth.requireAuth()) return;

    const user = Auth.getUser();
    if (user) {
      // 頭像（取姓氏第一個字）
      const avatar = Utils.$('#profile-avatar');
      if (avatar) avatar.textContent = (user.name || '?')[0];

      // 名稱
      const name = Utils.$('#profile-name');
      if (name) name.textContent = user.name || '-';

      // 帳號資訊
      Utils.$('#info-name').textContent = user.name || '-';
      Utils.$('#info-phone').textContent = user.phone || '-';
      Utils.$('#info-email').textContent = user.email || '-';
    }

    // 動態計算點數（已完成訂單 x 5）
    const pointsEl = Utils.$('#profile-points');
    const orderResult = await API.getOrders();
    if (orderResult && orderResult.success && orderResult.data) {
      const completedCount = orderResult.data.filter(o => o.order_status === '80').length;
      const totalPoints = completedCount * 5;
      if (pointsEl) pointsEl.textContent = `累積點數：${totalPoints} P`;
    } else {
      if (pointsEl) pointsEl.textContent = '累積點數：0 P';
    }

    // 登出
    Utils.$('#logout-btn').addEventListener('click', () => {
      if (Utils.confirm('確定要登出嗎？')) {
        Auth.logout();
      }
    });
  });
</script>
</body>
</html>
