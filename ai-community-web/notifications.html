<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通知設定 - Aî 智慧社區</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/orders.css">
  <style>
    .notif-card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .notif-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .notif-title { font-size: 14px; font-weight: bold; color: #333; }
    .notif-time { font-size: 11px; color: #999; }
    .notif-body { font-size: 13px; color: #555; line-height: 1.6; }
    .notif-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; color: #fff; margin-left: 6px; }
    .notif-empty { text-align: center; color: #999; padding: 60px 0; }
    .notif-empty .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .notif-dot { width: 8px; height: 8px; border-radius: 50%; background: #FF5722; display: inline-block; margin-right: 6px; }
    .notif-dot.read { background: transparent; }
  </style>
</head>
<body>
<div class="page-wrapper">
  <!-- Header -->
  <div class="page-header">
    <span class="header-back" onclick="history.back()">←</span>
    <span class="header-title">通知中心</span>
    <span></span>
  </div>

  <!-- 頁面內容 -->
  <div class="page-content">
    <div id="notif-list">
      <div class="loading">載入中...</div>
    </div>
  </div>

  <!-- 底部導覽列 -->
  <nav class="nav-bar">
    <a href="index.html" class="nav-item">
      <span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 001 1h3m10-11v10a1 1 0 01-1 1h-3m-6 0v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg></span>
      <span>首頁</span>
    </a>
    <a href="services.html" class="nav-item">
      <span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg></span>
      <span>服務</span>
    </a>
    <a href="orders.html" class="nav-item">
      <span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h4"/></svg></span>
      <span>訂單</span>
    </a>
    <a href="profile.html" class="nav-item active">
      <span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 10-16 0"/></svg></span>
      <span>我的</span>
    </a>
  </nav>
</div>

<!-- Scripts -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/crypto.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (!Auth.requireAuth()) return;

    const container = document.getElementById('notif-list');
    const user = Auth.getUser();
    if (!user) return;

    // 載入訂單資料，根據訂單狀態產生通知
    const result = await API.getOrders();

    if (!result || !result.success || !result.data || result.data.length === 0) {
      container.innerHTML = '<div class="notif-empty"><div class="empty-icon">🔔</div><p>目前沒有通知</p></div>';
      return;
    }

    const orders = result.data;
    const notifications = [];

    const statusInfo = {
      '01': { label: '待媒合', color: '#FF9800', icon: '⏳', message: '您的訂單正在等待媒合服務商，請耐心等候。' },
      '02': { label: '媒合中', color: '#2196F3', icon: '🔍', message: '已找到可能的服務商，正在為您確認中。' },
      '03': { label: '已確認', color: '#2196F3', icon: '✅', message: '服務商已確認接單，即將為您服務。' },
      '04': { label: '進行中', color: '#2196F3', icon: '🔧', message: '服務正在進行中，如有問題請聯繫客服。' },
      '80': { label: '已完成', color: '#4CAF50', icon: '🎉', message: '服務已完成，感謝您的使用！歡迎給予評價。' },
      '90': { label: '已取消', color: '#9E9E9E', icon: '❌', message: '此訂單已取消。如有疑問請聯繫客服。' },
      '99': { label: '已退款', color: '#F44336', icon: '💰', message: '退款已處理，款項將於 3-5 個工作天退回。' },
    };

    orders.forEach(order => {
      const info = statusInfo[order.order_status] || { label: '未知', color: '#999', icon: '📋', message: '訂單狀態更新。' };
      notifications.push({
        orderNo: order.order_no,
        recordId: order.record_id,
        status: order.order_status,
        statusLabel: info.label,
        statusColor: info.color,
        icon: info.icon,
        message: info.message,
        serviceName: order.service_name || order.vendor_name || '服務',
        time: order.order_time,
        isNew: ['01', '02', '03', '04'].includes(order.order_status),
      });
    });

    // 依時間排序（最新在前）
    notifications.sort((a, b) => new Date(b.time) - new Date(a.time));

    container.innerHTML = notifications.map(n => `
      <div class="notif-card" onclick="Utils.navigate('order-detail.html?id=${n.recordId}')" style="cursor:pointer;">
        <div class="notif-header">
          <span class="notif-title">
            <span class="notif-dot ${n.isNew ? '' : 'read'}"></span>
            ${n.icon} ${n.serviceName}
            <span class="notif-badge" style="background:${n.statusColor};">${n.statusLabel}</span>
          </span>
          <span class="notif-time">${Utils.formatDateTime ? Utils.formatDateTime(n.time) : n.time}</span>
        </div>
        <div class="notif-body">
          訂單 ${n.orderNo}：${n.message}
        </div>
      </div>
    `).join('');
  });
</script>
</body>
</html>
