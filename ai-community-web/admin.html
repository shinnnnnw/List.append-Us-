<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>廠商後台 - Aî 智慧社區</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/orders.css">
  <style>
    .admin-login { max-width: 400px; margin: 60px auto; padding: 0 16px; }
    .admin-login h2 { text-align: center; margin-bottom: 24px; color: var(--text-primary); }
    .admin-field { margin-bottom: 16px; }
    .admin-field label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
    .admin-field input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
    .admin-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--primary); color: #fff; font-size: 15px; cursor: pointer; margin-top: 8px; }
    .admin-btn:hover { background: var(--primary-dark); }
    .admin-error { color: #d32f2f; font-size: 13px; margin-top: 8px; text-align: center; display: none; }

    .admin-dashboard { display: none; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: var(--primary); color: #fff; }
    .admin-header h2 { font-size: 16px; }
    .admin-logout { background: none; border: 1px solid #fff; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .admin-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px; }
    .stat-card { background: #fff; border-radius: 10px; padding: 16px; text-align: center; box-shadow: var(--shadow-sm); }
    .stat-card .stat-num { font-size: 28px; font-weight: bold; color: var(--primary); }
    .stat-card .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

    .admin-tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 16px; background: #fff; }
    .admin-tab { flex: 1; text-align: center; padding: 12px 0; font-size: 14px; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; }
    .admin-tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: bold; }

    .admin-list { padding: 12px 16px; }
    .case-card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow-sm); cursor: pointer; }
    .case-card:hover { box-shadow: var(--shadow); }
    .case-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .case-title { font-size: 14px; font-weight: bold; }
    .case-badge { font-size: 11px; padding: 3px 8px; border-radius: 12px; color: #fff; }
    .badge-pending { background: #FF9800; }
    .badge-progress { background: #2196F3; }
    .badge-done { background: #4CAF50; }
    .badge-cancel { background: #9E9E9E; }
    .case-info { font-size: 12px; color: var(--text-secondary); line-height: 1.8; }

    .case-detail { display: none; padding: 16px; }
    .detail-back { font-size: 14px; color: var(--primary); cursor: pointer; margin-bottom: 12px; display: inline-block; }
    .detail-section { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
    .detail-section h4 { font-size: 14px; margin-bottom: 10px; color: var(--text-primary); }
    .detail-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; border-bottom: 1px solid var(--border-light); }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: var(--text-secondary); }
    .detail-value { color: var(--text-primary); font-weight: 500; }

    .status-select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; width: 100%; margin-top: 8px; }
    .reply-area { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; resize: vertical; margin-top: 8px; min-height: 80px; }
    .reply-btn { margin-top: 8px; padding: 10px 16px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; }
    .reply-list { margin-top: 12px; }
    .reply-item { background: var(--bg); padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 12px; line-height: 1.6; }
    .reply-item .reply-time { color: var(--text-muted); font-size: 11px; }
  </style>
</head>
<body>

<!-- 登入畫面 -->
<div id="admin-login" class="admin-login">
  <h2>廠商後台登入</h2>
  <div class="card">
    <div class="admin-field">
      <label>廠商帳號</label>
      <input type="text" id="admin-username" placeholder="請輸入帳號">
    </div>
    <div class="admin-field">
      <label>密碼</label>
      <input type="password" id="admin-password" placeholder="請輸入密碼">
    </div>
    <button class="admin-btn" onclick="adminLogin()">登入</button>
    <p class="admin-error" id="admin-error">帳號或密碼錯誤</p>
  </div>
</div>

<!-- 後台儀表板 -->
<div id="admin-dashboard" class="admin-dashboard">
  <div class="admin-header">
    <h2>廠商管理後台</h2>
    <button class="admin-logout" onclick="adminLogout()">登出</button>
  </div>

  <!-- 統計卡片 -->
  <div class="admin-stats">
    <div class="stat-card">
      <div class="stat-num" id="stat-pending">0</div>
      <div class="stat-label">待處理</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-progress">0</div>
      <div class="stat-label">進行中</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-done">0</div>
      <div class="stat-label">已完成</div>
    </div>
  </div>

  <!-- Tab 切換 -->
  <div class="admin-tabs">
    <div class="admin-tab active" data-tab="all" onclick="switchTab('all')">全部</div>
    <div class="admin-tab" data-tab="pending" onclick="switchTab('pending')">待處理</div>
    <div class="admin-tab" data-tab="progress" onclick="switchTab('progress')">進行中</div>
    <div class="admin-tab" data-tab="done" onclick="switchTab('done')">已完成</div>
  </div>

  <!-- 案件列表 -->
  <div class="admin-list" id="case-list"></div>

  <!-- 案件詳情 -->
  <div class="case-detail" id="case-detail"></div>
</div>

<script>
const API_BASE = 'https://adjvx2bs1a.execute-api.us-west-2.amazonaws.com/prod';

// 廠商帳號從 API 驗證（不再寫死）
let currentVendor = null;

// 所有案件資料（含 vendorId 欄位，登入後只顯示自己的）

  {

  },
  // === 泰皇殿 (vendor_id: 23) 的案件 ===
  {
    id: 'FB2607310004',
    vendorId: 23,
    customerName: '黃志豪',

    service: '餐廳訂位',

  {

    customerName: '蔡宜庭',

    createdAt: '2026-07-30 20:15',
    address: '',
    replies: [],
  },
  {
    id: 'FB2607280010',
    vendorId: 23,
    customerName: '吳正男',
    customerPhone: '0922-333-010',
    customerEmail: 'wu.zn@example.com',
    service: '餐廳訂位',
    category: '訂位',
    description: '7/30 晚上 7 點，2 位用餐，想坐靠窗位置，有過敏不吃花生。',
    status: 'done',
    createdAt: '2026-07-28 10:00',
    address: '',
    replies: [
      { time: '2026-07-28 11:00', content: '已為您保留靠窗座位，會標註花生過敏。' },
      { time: '2026-07-30 21:00', content: '感謝光臨，歡迎再訪！' },
    ],
  },
];

// 依當前登入廠商篩選出的案件
let cases = [];

const statusMap = {
  pending: { label: '待處理', badge: 'badge-pending' },
  progress: { label: '進行中', badge: 'badge-progress' },
  done: { label: '已完成', badge: 'badge-done' },
  cancel: { label: '已取消', badge: 'badge-cancel' },
};

// 登入
async function adminLogin() {
  const username = document.getElementById('admin-username').value.trim();
  const password = document.getElementById('admin-password').value.trim();
  const errorEl = document.getElementById('admin-error');

  if (!username || !password) {
    errorEl.textContent = '請輸入帳號與密碼';
    errorEl.style.display = 'block';
    return;
  }

  const btn = document.querySelector('.admin-btn');
  btn.disabled = true;
  btn.textContent = '登入中...';

  try {
    const res = await fetch(API_BASE + '/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const result = await res.json();

    if (result.success && result.data) {
      currentVendor = {
        vendorId: result.data.vendorId,
        vendorName: result.data.shopName,
        contactName: result.data.name,
      };
      cases = allCases.filter(c => c.vendorId === currentVendor.vendorId);
      errorEl.style.display = 'none';
      document.getElementById('admin-login').style.display = 'none';
      document.getElementById('admin-dashboard').style.display = 'block';
      document.querySelector('.admin-header h2').textContent = currentVendor.vendorName + ' - 管理後台';
      renderDashboard();
    } else {
      errorEl.textContent = result.message || '帳號或密碼錯誤';
      errorEl.style.display = 'block';
    }
  } catch (err) {
    errorEl.textContent = '網路錯誤，請稍後再試';
    errorEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = '登入';
  }
}
  }
}

// 登出
function adminLogout() {
  currentVendor = null;
  cases = [];
  document.getElementById('admin-login').style.display = 'block';
  document.getElementById('admin-dashboard').style.display = 'none';
  document.getElementById('admin-username').value = '';
  document.getElementById('admin-password').value = '';
}

// 渲染儀表板
function renderDashboard() {
  const pending = cases.filter(c => c.status === 'pending').length;
  const progress = cases.filter(c => c.status === 'progress').length;
  const done = cases.filter(c => c.status === 'done').length;

  document.getElementById('stat-pending').textContent = pending;
  document.getElementById('stat-progress').textContent = progress;
  document.getElementById('stat-done').textContent = done;

  renderCaseList('all');
}

// Tab 切換
function switchTab(tab) {
  document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.admin-tab[data-tab="${tab}"]`).classList.add('active');
  renderCaseList(tab);
}

// 渲染案件列表
function renderCaseList(filter) {
  const listEl = document.getElementById('case-list');
  const detailEl = document.getElementById('case-detail');
  listEl.style.display = 'block';
  detailEl.style.display = 'none';

  const filtered = filter === 'all' ? cases : cases.filter(c => c.status === filter);

  if (filtered.length === 0) {
    listEl.innerHTML = '<p style="text-align:center;color:#999;padding:40px 0;">目前沒有案件</p>';
    return;
  }

  listEl.innerHTML = filtered.map(c => {
    const st = statusMap[c.status];
    return `
      <div class="case-card" onclick="showDetail('${c.id}')">
        <div class="case-header">
          <span class="case-title">${c.service} - ${c.customerName}</span>
          <span class="case-badge ${st.badge}">${st.label}</span>
        </div>
        <div class="case-info">
          <div>案件編號：${c.id}</div>
          <div>建立時間：${c.createdAt}</div>
          <div>需求摘要：${c.description.substring(0, 30)}${c.description.length > 30 ? '...' : ''}</div>
        </div>
      </div>
    `;
  }).join('');
}

// 顯示案件詳情
function showDetail(id) {
  const c = cases.find(x => x.id === id);
  if (!c) return;

  const listEl = document.getElementById('case-list');
  const detailEl = document.getElementById('case-detail');
  listEl.style.display = 'none';
  detailEl.style.display = 'block';

  const st = statusMap[c.status];
  const repliesHtml = c.replies.length > 0
    ? c.replies.map(r => `<div class="reply-item"><div class="reply-time">${r.time}</div><div>${r.content}</div></div>`).join('')
    : '<p style="color:#999;font-size:12px;">尚無回覆紀錄</p>';

  detailEl.innerHTML = `
    <span class="detail-back" onclick="renderCaseList(document.querySelector('.admin-tab.active').dataset.tab)">← 返回列表</span>

    <div class="detail-section">
      <h4>案件資訊</h4>
      <div class="detail-row"><span class="detail-label">案件編號</span><span class="detail-value">${c.id}</span></div>
      <div class="detail-row"><span class="detail-label">服務類別</span><span class="detail-value">${c.category} / ${c.service}</span></div>
      <div class="detail-row"><span class="detail-label">建立時間</span><span class="detail-value">${c.createdAt}</span></div>
      <div class="detail-row"><span class="detail-label">目前狀態</span><span class="case-badge ${st.badge}">${st.label}</span></div>
    </div>

    <div class="detail-section">
      <h4>消費者資訊</h4>
      <div class="detail-row"><span class="detail-label">姓名</span><span class="detail-value">${c.customerName}</span></div>
      <div class="detail-row"><span class="detail-label">電話</span><span class="detail-value"><a href="tel:${c.customerPhone}" style="color:var(--primary)">${c.customerPhone}</a></span></div>
      <div class="detail-row"><span class="detail-label">Email</span><span class="detail-value">${c.customerEmail}</span></div>
      ${c.address ? `<div class="detail-row"><span class="detail-label">地址</span><span class="detail-value">${c.address}</span></div>` : ''}
    </div>

    <div class="detail-section">
      <h4>需求內容</h4>
      <p style="font-size:13px;line-height:1.8;color:#333;">${c.description}</p>
    </div>

    <div class="detail-section">
      <h4>狀態管理</h4>
      <select class="status-select" id="status-select" onchange="updateStatus('${c.id}', this.value)">
        <option value="pending" ${c.status === 'pending' ? 'selected' : ''}>待處理</option>
        <option value="progress" ${c.status === 'progress' ? 'selected' : ''}>進行中</option>
        <option value="done" ${c.status === 'done' ? 'selected' : ''}>已完成</option>
        <option value="cancel" ${c.status === 'cancel' ? 'selected' : ''}>已取消</option>
      </select>
    </div>

    <div class="detail-section">
      <h4>回覆紀錄</h4>
      <div class="reply-list">${repliesHtml}</div>
      <textarea class="reply-area" id="reply-input" placeholder="輸入回覆內容..."></textarea>
      <button class="reply-btn" onclick="addReply('${c.id}')">送出回覆</button>
    </div>
  `;
}

// 更新狀態
function updateStatus(id, newStatus) {
  const c = cases.find(x => x.id === id);
  if (c) {
    c.status = newStatus;
    renderDashboard();
    showDetail(id);
  }
}

// 新增回覆
function addReply(id) {
  const input = document.getElementById('reply-input');
  const content = input.value.trim();
  if (!content) {
    alert('請輸入回覆內容');
    return;
  }

  const c = cases.find(x => x.id === id);
  if (c) {
    const now = new Date();
    const timeStr = now.getFullYear() + '-' +
      String(now.getMonth() + 1).padStart(2, '0') + '-' +
      String(now.getDate()).padStart(2, '0') + ' ' +
      String(now.getHours()).padStart(2, '0') + ':' +
      String(now.getMinutes()).padStart(2, '0');
    c.replies.push({ time: timeStr, content });
    showDetail(id);
  }
}

// Enter 登入
document.getElementById('admin-password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') adminLogin();
});
</script>
</body>
</html>
