<!-- 廠商後台邏輯 -->
<script>
// 從 API 載入的廠商案件資料（來自 pms_form_feedback + pms_case_assignment）
let vendorCases = [];
let vendorLoading = false;

const vendorStatusMap = {
  pending: { label: '待處理', color: '#FF9800' },
  progress: { label: '進行中', color: '#2196F3' },
  done: { label: '已完成', color: '#4CAF50' },
  cancel: { label: '已結束', color: '#9E9E9E' },
};

function vendorLogout() {
  localStorage.removeItem('vendorLogin');
  vendorCases = [];
  document.getElementById('view-vendor').classList.remove('active');
  document.getElementById('view-login').classList.add('active');
}

// 從 API 載入廠商案件（pms_form_feedback 透過 /admin/cases 取得）
async function vendorLoadCases() {
  const vendorId = localStorage.getItem('vendorId') || '0';
  vendorLoading = true;
  try {
    const result = await API.getVendorCases(vendorId);
    if (result && result.success && Array.isArray(result.data)) {
      vendorCases = result.data.map(item => ({
        id: item.feedback_no || item.id || '',
        assignmentId: item.feedback_no || item.id || '',
        vendorId: parseInt(vendorId),
        customerName: item.customerName || '',
        customerPhone: item.customerPhone || '',
        customerEmail: item.customerEmail || '',
        service: item.service || '服務',
        category: '',
        description: item.description || '',
        status: vendorMapApiStatus(item.status || '01'),
        createdAt: item.createdAt || '',
        address: item.address || '',
        replies: Array.isArray(item.replies) ? item.replies : [],
      }));
    } else {
      vendorCases = [];
    }
  } catch (err) {
    console.error('[Vendor] 載入案件失敗:', err);
    vendorCases = [];
  }
  vendorLoading = false;
}

// 格式化 ISO 時間為可讀的台灣時間（YYYY-MM-DD HH:mm）
function vendorFormatTime(isoStr) {
  if (!isoStr) return '';
  try {
    const date = new Date(isoStr);
    if (isNaN(date.getTime())) return isoStr;
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    const h = String(date.getHours()).padStart(2, '0');
    const min = String(date.getMinutes()).padStart(2, '0');
    return `${y}-${m}-${d} ${h}:${min}`;
  } catch (e) {
    return isoStr;
  }
}

// 將 API 回傳的狀態碼對應到前端狀態
function vendorMapApiStatus(apiStatus) {
  const statusMap = {
    '01': 'pending',
    '02': 'pending',
    '03': 'progress',
    '04': 'progress',
    '80': 'done',
    '90': 'cancel',
    '99': 'cancel',
    'pending': 'pending',
    'progress': 'progress',
    'done': 'done',
    'cancel': 'cancel',
  };
  return statusMap[apiStatus] || 'pending';
}

async function vendorShowDashboard() {
  document.getElementById('view-login').classList.remove('active');
  document.getElementById('view-dashboard').classList.remove('active');
  document.getElementById('view-vendor').classList.add('active');

  // 顯示店家名稱
  const shopName = localStorage.getItem('vendorShopName') || '廠商';
  const vendorHeader = document.querySelector('#view-vendor h2');
  if (vendorHeader) vendorHeader.textContent = shopName + ' — 管理後台';

  // 顯示載入狀態
  const listEl = document.getElementById('v-case-list');
  if (listEl) listEl.innerHTML = '<p style="text-align:center;color:#999;padding:40px 0;">載入中...</p>';

  // 從 API 載入真實資料
  await vendorLoadCases();

  vendorRenderStats();
  vendorRenderList('all');
}

// 取得當前廠商的案件
function getVendorMyCases() {
  return vendorCases;
}

// 解析 feedback_content JSON 為可讀的表單欄位 HTML
function vendorParseFeedbackContent(rawContent) {
  let items = [];
  try {
    items = typeof rawContent === 'string' ? JSON.parse(rawContent) : rawContent;
  } catch (e) {
    return `<p style="font-size:13px;line-height:1.8;color:#333;">${rawContent || '無'}</p>`;
  }

  if (!Array.isArray(items) || items.length === 0) {
    return `<p style="font-size:13px;line-height:1.8;color:#333;">${rawContent || '無'}</p>`;
  }

  // 表單題目名稱對照（根據 form_id=6 餐廳訂位 & 其他表單）
  const topicTitleMap = {
    1: '希望訂位日期', 2: '用餐人數', 3: '用餐時段',
    4: '特殊需求', 5: '備註', 6: '聯絡資料',
    7: '商品名稱或類別', 8: '詳細需求', 9: '預算上限（元）',
    10: '收貨方式', 11: '聯絡與配送資料',
    12: '清潔類型', 13: '坪數', 14: '希望時段',
    15: '上傳環境照片', 16: '需求說明', 17: '聯絡與服務地址',
    22: '包裹大小', 23: '重量（公斤）', 24: '收件方式',
    25: '寄件備註', 26: '收件人聯絡與地址',
    27: '想吃的餐點或餐廳', 28: '用餐人數', 29: '希望送達時間',
    30: '預算上限（元）', 31: '其他備註',
    33: '修繕類型', 34: '急迫程度', 35: '問題描述',
    38: '上傳參考照片',
  };

  // 用餐時段選項對照
  const mealTimeOptions = ['午餐 11:30', '午餐 12:00', '晚餐 17:30', '晚餐 18:00', '晚餐 18:30', '晚餐 19:00'];
  // 特殊需求選項對照
  const specialOptions = ['兒童椅', '無障礙座位', '包廂', '生日蛋糕', '素食'];

  let html = '';
  for (const item of items) {
    const title = topicTitleMap[item.topicId] || `題目 ${item.topicId}`;
    let answer = '';

    if (item.type === '10' || item.type === '8') {
      // 聯絡資料物件
      if (item.answer && typeof item.answer === 'object') {
        const parts = [];
        if (item.answer.name) parts.push(`姓名：${item.answer.name}`);
        if (item.answer.phone) parts.push(`電話：${item.answer.phone}`);
        if (item.answer.email) parts.push(`Email：${item.answer.email}`);
        if (item.answer.address) parts.push(`地址：${item.answer.address}`);
        answer = parts.join('、');
      } else {
        answer = String(item.answer || '');
      }
    } else if (item.type === '4') {
      // 複選題 — answer 是索引陣列
      if (Array.isArray(item.answer)) {
        if (item.topicId === 4) {
          answer = item.answer.map(idx => specialOptions[parseInt(idx) - 1] || idx).join('、');
        } else {
          answer = item.answer.join('、');
        }
      } else {
        answer = String(item.answer || '');
      }
    } else if (item.type === '3') {
      // 單選題 — answer 是選項索引
      if (item.topicId === 3) {
        const idx = parseInt(item.answer) - 1;
        answer = mealTimeOptions[idx] || item.answer;
      } else {
        answer = String(item.answer || '');
      }
    } else {
      answer = String(item.answer || '');
    }

    html += `<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid #eee;"><span style="color:#666;">${title}</span><span style="text-align:right;max-width:60%;">${answer}</span></div>`;
  }

  return html;
}

function vendorRenderStats() {
  const myCases = getVendorMyCases();
  const pending = myCases.filter(c => c.status === 'pending').length;
  const progress = myCases.filter(c => c.status === 'progress').length;
  const done = myCases.filter(c => c.status === 'done').length;
  const cancel = myCases.filter(c => c.status === 'cancel').length;
  document.getElementById('v-stat-pending').textContent = pending;
  document.getElementById('v-stat-progress').textContent = progress;
  document.getElementById('v-stat-done').textContent = done;
  document.getElementById('v-stat-cancel').textContent = cancel;
}

function vendorSwitchTab(tab) {
  document.querySelectorAll('.v-tab').forEach(t => {
    t.style.borderBottom = '2px solid transparent';
    t.style.color = '#666';
    t.style.fontWeight = 'normal';
    t.classList.remove('active');
  });
  const activeTab = document.querySelector(`.v-tab[data-tab="${tab}"]`);
  if (activeTab) {
    activeTab.style.borderBottom = '2px solid #4CAF50';
    activeTab.style.color = '#4CAF50';
    activeTab.style.fontWeight = 'bold';
    activeTab.classList.add('active');
  }
  vendorRenderList(tab);
}

function vendorRenderList(filter) {
  const listEl = document.getElementById('v-case-list');
  const detailEl = document.getElementById('v-case-detail');
  listEl.style.display = 'block';
  detailEl.style.display = 'none';

  const myCases = getVendorMyCases();
  const filtered = filter === 'all' ? myCases : myCases.filter(c => c.status === filter);

  if (filtered.length === 0) {
    listEl.innerHTML = '<p style="text-align:center;color:#999;padding:40px 0;">目前沒有案件</p>';
    return;
  }

  listEl.innerHTML = filtered.map(c => {
    const st = vendorStatusMap[c.status];
    return `
      <div class="card" style="padding:14px;margin-bottom:10px;cursor:pointer;" onclick="vendorShowDetail('${c.id}')">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:14px;font-weight:bold;">${c.service} - ${c.customerName}</span>
          <span style="font-size:11px;padding:3px 8px;border-radius:12px;color:#fff;background:${st.color};">${st.label}</span>
        </div>
        <div style="font-size:12px;color:#666;line-height:1.8;">
          <div>案件編號：${c.id}</div>
          <div>建立時間：${vendorFormatTime(c.createdAt)}</div>
        </div>
      </div>
    `;
  }).join('');
}

function vendorShowDetail(id) {
  const c = vendorCases.find(x => x.id === id);
  if (!c) return;

  const listEl = document.getElementById('v-case-list');
  const detailEl = document.getElementById('v-case-detail');
  listEl.style.display = 'none';
  detailEl.style.display = 'block';

  const st = vendorStatusMap[c.status];
  const displayTime = vendorFormatTime(c.createdAt);
  const displayCategory = c.category ? `${c.category} / ${c.service}` : c.service;

  detailEl.innerHTML = `
    <span style="font-size:14px;color:#4CAF50;cursor:pointer;" onclick="vendorSwitchTab(document.querySelector('.v-tab.active').dataset.tab)">← 返回列表</span>

    <div class="card" style="padding:14px;margin-top:12px;">
      <h4 style="font-size:14px;margin-bottom:10px;">案件資訊</h4>
      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid #eee;"><span style="color:#666;">案件編號</span><span>${c.id}</span></div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid #eee;"><span style="color:#666;">服務類別</span><span>${displayCategory}</span></div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid #eee;"><span style="color:#666;">建立時間</span><span>${displayTime}</span></div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;"><span style="color:#666;">目前狀態</span><span style="padding:3px 8px;border-radius:12px;color:#fff;background:${st.color};font-size:11px;">${st.label}</span></div>
    </div>

    <div class="card" style="padding:14px;margin-top:12px;">
      <h4 style="font-size:14px;margin-bottom:10px;">消費者資訊</h4>
      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid #eee;"><span style="color:#666;">姓名</span><span>${c.customerName}</span></div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid #eee;"><span style="color:#666;">電話</span><span><a href="tel:${c.customerPhone}" style="color:#4CAF50;">${c.customerPhone}</a></span></div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;${c.address ? 'border-bottom:1px solid #eee;' : ''}"><span style="color:#666;">Email</span><span>${c.customerEmail}</span></div>
      ${c.address ? `<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;"><span style="color:#666;">地址</span><span>${c.address}</span></div>` : ''}
    </div>

    <div class="card" style="padding:14px;margin-top:12px;">
      <h4 style="font-size:14px;margin-bottom:10px;">需求內容</h4>
      ${vendorParseFeedbackContent(c.description)}
    </div>

    <div class="card" style="padding:14px;margin-top:12px;">
      <h4 style="font-size:14px;margin-bottom:10px;">狀態管理</h4>
      <select id="v-status-select" style="width:100%;padding:8px 12px;border:1px solid #e0e0e0;border-radius:6px;font-size:13px;">
        <option value="pending" ${c.status === 'pending' ? 'selected' : ''}>待處理</option>
        <option value="progress" ${c.status === 'progress' ? 'selected' : ''}>進行中</option>
        <option value="done" ${c.status === 'done' ? 'selected' : ''}>已完成</option>
        <option value="cancel" ${c.status === 'cancel' ? 'selected' : ''}>已結束</option>
      </select>
      <button onclick="vendorSubmitStatus('${c.id}')" style="margin-top:12px;padding:10px 16px;background:#4CAF50;color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer;">送出最新狀態</button>
    </div>
  `;
}

async function vendorSubmitStatus(id) {
  const select = document.getElementById('v-status-select');
  const newStatus = select.value;
  const c = vendorCases.find(x => x.id === id);
  if (!c) return;

  // 前端狀態對應回 API 狀態碼
  const frontToApiStatus = {
    'pending': '01',
    'progress': '03',
    'done': '80',
    'cancel': '90',
  };
  const apiStatus = frontToApiStatus[newStatus] || '01';

  // 呼叫 API 更新狀態
  const btn = select.nextElementSibling;
  if (btn) { btn.disabled = true; btn.textContent = '更新中...'; }

  try {
    const assignmentId = c.assignmentId || c.id;
    const result = await API.updateCaseStatus(assignmentId, apiStatus);
    if (result && result.success) {
      c.status = newStatus;
      alert('狀態已更新為：' + vendorStatusMap[newStatus].label);
      vendorRenderStats();
      vendorShowDetail(id);
    } else {
      alert('更新失敗：' + (result.message || '請稍後再試'));
      if (btn) { btn.disabled = false; btn.textContent = '送出最新狀態'; }
    }
  } catch (err) {
    console.error('[Vendor] 更新狀態失敗:', err);
    alert('網路錯誤，請稍後再試');
    if (btn) { btn.disabled = false; btn.textContent = '送出最新狀態'; }
  }
}
</script>
</body>
</html>
