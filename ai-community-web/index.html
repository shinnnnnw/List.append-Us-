<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Ai 智慧社區服務平台</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/services.css">
</head>
<body>

<!-- ===== 登入畫面 ===== -->
<div id="view-login" class="view active">
  <div class="login-view">
    <div class="login-container">
      <div class="login-logo">
        <h1>Aî 智慧社區服務平台</h1>
        <p>— 智慧管家，一站搞定生活大小事 —</p>
      </div>

      <!-- 第一步：歡迎頁 -->
      <div id="login-step-welcome" class="login-card">
        <h2>使用 uniopen 帳號登入</h2>
        <p class="login-desc">整合零售、物流、餐飲、生活，單一帳號免切換 App。</p>
        <button id="btn-go-login" class="login-btn">開始登入</button>
        <ul class="login-features">
          <li>AI 智慧管家即時服務</li>
          <li>一站整合六大生活服務</li>
          <li>消費累積點數回饋</li>
        </ul>
      </div>

      <!-- 第二步：登入表單 -->
      <div id="login-step-form" class="login-card" style="display:none">
        <h2>帳號登入</h2>

        <!-- 快速登入區塊 -->
        <div class="login-section">
          <div class="login-section-title">快速登入</div>
          <p class="login-section-desc">選擇已註冊的帳號直接登入</p>
          <select id="user-select" class="login-select">
            <option value="">-- 選擇帳號 --</option>
          </select>
          <button id="btn-quick-login" class="login-btn" style="margin-top:12px">快速登入</button>
        </div>

        <div class="login-divider">
          <span></span>
          <p>或</p>
          <span></span>
        </div>

        <!-- 手動登入區塊 -->
        <div class="login-section">
          <div class="login-section-title">手動登入</div>
          <p class="login-section-desc">輸入手機號碼與密碼</p>
          <div class="login-field">
            <label>手機號碼</label>
            <input id="phone-input" type="tel" placeholder="例如：0912345001">
          </div>
          <div class="login-field">
            <label>密碼</label>
            <input id="password-input" type="password" placeholder="請輸入密碼">
          </div>
          <button id="btn-manual-login" class="login-btn" style="margin-top:12px">登入</button>
        </div>

        <!-- 錯誤訊息 -->
        <p id="login-error" class="login-error"></p>

        <!-- 返回 -->
        <button id="btn-back-welcome" class="login-back-btn">← 返回</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== 主控台畫面 ===== -->
<div id="view-dashboard" class="view">
  <div class="page-wrapper">
    <!-- Header -->
    <div class="page-header">
      <span id="header-title" class="header-title">嗨，住戶！AI 智慧管家在線上</span>
      <span id="points-text" class="header-action">50 P</span>
    </div>

    <!-- 頁面內容 -->
    <div class="page-content">
      <!-- 快捷服務 -->
      <h3 class="section-title">一站搞定生活大小事</h3>
      <div id="service-grid" class="service-grid"></div>

      <!-- AI 聊天 -->
      <div class="chat-section">
        <div id="chat-container" class="chat-container"></div>
        <div class="chat-input-bar">
          <input id="chat-input" type="text" placeholder="輸入您的生活需求... (例如：我想訂明天晚上的餐廳)">
          <button id="chat-voice-btn" class="chat-voice-btn" title="語音輸入">🎙️</button>
          <button id="chat-send-btn" class="chat-send-btn">發送</button>
        </div>
      </div>
    </div>

    <!-- 底部導覽列 -->
    <nav class="nav-bar hidden">
      <a href="index.html" class="nav-item active">
        <span class="nav-icon">🏠</span>
        <span>首頁</span>
      </a>
      <a href="services.html" class="nav-item">
        <span class="nav-icon">🛎️</span>
        <span>服務</span>
      </a>
      <a href="orders.html" class="nav-item">
        <span class="nav-icon">📋</span>
        <span>訂單</span>
      </a>
      <a href="profile.html" class="nav-item">
        <span class="nav-icon">👤</span>
        <span>我的</span>
      </a>
    </nav>
  </div>
</div>

<!-- Scripts -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/chat.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    App.initIndex();
  });
</script>
</body>
</html>
