<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Aî 智慧社區服務平台</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/services.css">
</head>
<body>

<!-- ===== 登入畫面 ===== -->
<div id="view-login" class="view active">
  <div class="login-view">
    <div class="login-container">
      <div class="login-logo">
        <h1>Aî 智慧社區服務平台</h1>
        <p>— 智慧管家，一站搞定生活大小事 —</p>
      </div>
      <div class="login-card">
        <h2>使用 uniopen 帳號登入</h2>
        <p class="login-desc">整合零售、物流、餐飲、生活，單一帳號免切換 App。</p>
        <button id="login-btn" class="login-btn">OpenPî / uniopen 一鍵授權登入</button>
        <ul class="login-features">
          <li>AI 智慧管家即時服務</li>
          <li>一站整合六大生活服務</li>
          <li>消費累積點數回饋</li>
        </ul>
      </div>
    </div>
  </div>
</div>

<!-- ===== 主控台畫面 ===== -->
<div id="view-dashboard" class="view">
  <div class="page-wrapper">
    <!-- Header -->
    <div class="page-header">
      <span id="header-title" class="header-title">嗨，住戶！AI 智慧管家在線上</span>
      <span id="points-text" class="header-action">50 P</span>
    </div>

    <!-- 頁面內容 -->
    <div class="page-content">
      <!-- 快捷服務 -->
      <h3 class="section-title">一站搞定生活大小事</h3>
      <div id="service-grid" class="service-grid"></div>

      <!-- AI 聊天 -->
      <div class="chat-section">
        <div id="chat-container" class="chat-container"></div>
        <div class="chat-input-bar">
          <input id="chat-input" type="text" placeholder="輸入您的生活需求... (例如：我想訂明天晚上的餐廳)">
          <button id="chat-send-btn" class="chat-send-btn">發送</button>
        </div>
      </div>
    </div>

    <!-- 底部導覽列 -->
    <nav class="nav-bar hidden">
      <a href="index.html" class="nav-item active">
        <span class="nav-icon">🏠</span>
        <span>首頁</span>
      </a>
      <a href="services.html" class="nav-item">
        <span class="nav-icon">🛎️</span>
        <span>服務</span>
      </a>
      <a href="orders.html" class="nav-item">
        <span class="nav-icon">📋</span>
        <span>訂單</span>
      </a>
      <a href="profile.html" class="nav-item">
        <span class="nav-icon">👤</span>
        <span>我的</span>
      </a>
    </nav>
  </div>
</div>

<!-- Scripts -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/chat.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    App.initIndex();
  });
</script>
</body>
</html>
