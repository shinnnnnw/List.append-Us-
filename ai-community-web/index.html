<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Aî 智慧社區服務平台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif;background:#F5F7FA;color:#263238;}
.view{display:none;}
.view.active{display:flex;}

/* ── 手機外框 ── */
.phone-wrap{width:100%;min-height:100vh;display:flex;justify-content:center;background:#E8EDF2;}
.phone{width:100%;max-width:430px;min-height:100vh;background:#F5F7FA;display:flex;flex-direction:column;position:relative;overflow:hidden;}

/* ── 登入 ── */
#view-login{align-items:center;justify-content:center;min-height:100vh;background:#F4F6F8;padding:24px;}
.login-wrap{width:100%;max-width:380px;}
.login-logo{text-align:center;margin-bottom:36px;}
.login-logo h1{font-size:26px;font-weight:800;color:#2E7D32;letter-spacing:-0.5px;}
.login-logo p{font-size:13px;color:#78909C;margin-top:6px;}
.login-card{background:#fff;border-radius:20px;padding:28px;box-shadow:0 4px 20px rgba(0,0,0,0.08);}
.login-card h2{font-size:17px;font-weight:700;color:#263238;text-align:center;margin-bottom:6px;}
.login-card p{font-size:13px;color:#90A4AE;text-align:center;line-height:1.6;margin-bottom:24px;}
.login-btn{display:block;width:100%;background:#FF5722;color:#fff;font-size:15px;font-weight:700;padding:15px;border:none;border-radius:30px;cursor:pointer;transition:opacity .15s;}
.login-btn:hover{opacity:.9;}
.login-divider{display:flex;align-items:center;gap:12px;margin:20px 0;}
.login-divider span{flex:1;height:1px;background:#ECEFF1;}
.login-divider p{font-size:12px;color:#B0BEC5;}

/* ── 主畫面 ── */
#view-dashboard{flex-direction:column;height:100vh;}
.dash-header{background:#2E7D32;padding:16px 20px;padding-top:44px;display:flex;justify-content:space-between;align-items:flex-end;flex-shrink:0;}
.dash-header-left h2{color:#fff;font-size:18px;font-weight:700;}
.dash-header-left p{color:rgba(255,255,255,.7);font-size:12px;margin-top:2px;}
.points-badge{background:rgba(255,255,255,.2);border-radius:12px;padding:8px 12px;text-align:center;}
.points-badge .num{color:#fff;font-size:20px;font-weight:800;line-height:1;}
.points-badge .lbl{color:rgba(255,255,255,.7);font-size:10px;}

.svc-row{display:flex;background:#fff;border-bottom:1px solid #ECEFF1;flex-shrink:0;}
.svc-btn{flex:1;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;cursor:pointer;}
.svc-btn:hover{background:#F5F7FA;}
.svc-icon{font-size:22px;}
.svc-label{font-size:11px;font-weight:600;}

.chat-area{flex:1;overflow-y:auto;padding:14px 14px 8px;}
.msg-row{display:flex;margin-bottom:12px;align-items:flex-end;gap:8px;}
.msg-row.user{justify-content:flex-end;}
.avatar{width:28px;height:28px;border-radius:50%;background:#E8F5E9;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.bubble{padding:12px 14px;border-radius:16px;max-width:78%;font-size:14px;line-height:1.6;}
.bubble.ai{background:#fff;color:#263238;border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.07);border:1px solid #ECEFF1;}
.bubble.user{background:#2E7D32;color:#fff;border-bottom-right-radius:4px;}
.form-trigger{margin-top:10px;background:#E8F5E9;border:none;border-radius:8px;padding:10px 14px;width:100%;text-align:left;cursor:pointer;font-size:13px;font-weight:600;color:#2E7D32;display:flex;align-items:center;gap:6px;}
.form-trigger:hover{background:#C8E6C9;}

.input-bar{display:flex;padding:10px 12px;background:#fff;border-top:1px solid #ECEFF1;gap:8px;align-items:flex-end;flex-shrink:0;}
.chat-input{flex:1;border:1px solid #CFD8DC;border-radius:20px;padding:10px 16px;font-size:14px;background:#FAFAFA;resize:none;max-height:80px;font-family:inherit;}
.chat-input:focus{outline:none;border-color:#2E7D32;}
.send-btn{background:#2E7D32;color:#fff;border:none;border-radius:20px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;}
.send-btn:hover{background:#1B5E20;}

/* ── 表單頁 ── */
#view-form{flex-direction:column;height:100vh;}
.form-header{padding:16px 20px;padding-top:44px;display:flex;align-items:flex-end;gap:14px;flex-shrink:0;}
.back-btn{background:rgba(255,255,255,.25);border:none;border-radius:50%;width:34px;height:34px;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.form-header-text h2{color:#fff;font-size:20px;font-weight:700;}
.form-header-text p{color:rgba(255,255,255,.75);font-size:12px;margin-top:2px;}
.form-scroll{flex:1;overflow-y:auto;padding:16px;}
.form-card{background:#fff;border-radius:14px;padding:20px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.group-title{font-size:12px;font-weight:700;color:#90A4AE;text-transform:uppercase;letter-spacing:.8px;margin-bottom:16px;}
.topic{margin-bottom:20px;}
.topic:last-child{margin-bottom:0;}
.topic-label{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.topic-label span{font-size:14px;font-weight:500;color:#37474F;flex:1;}
.required-tag{font-size:10px;color:#E53935;background:#FFEBEE;padding:2px 7px;border-radius:4px;font-weight:700;}
input[type=text],input[type=tel],input[type=email],textarea,select{width:100%;border:1px solid #CFD8DC;border-radius:8px;padding:11px 13px;font-size:14px;color:#263238;background:#FAFAFA;font-family:inherit;}
input:focus,textarea:focus,select:focus{outline:none;border-color:#2E7D32;background:#fff;}
textarea{resize:vertical;min-height:90px;}
.opt-list{display:flex;flex-direction:column;gap:8px;}
.opt-btn{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid #CFD8DC;border-radius:8px;background:#FAFAFA;cursor:pointer;font-size:14px;color:#546E7A;text-align:left;transition:all .15s;}
.opt-btn.selected{border-color:#2E7D32;background:#E8F5E9;color:#1B5E20;font-weight:600;}
.radio-circle{width:18px;height:18px;border-radius:50%;border:2px solid #B0BEC5;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.radio-circle.on{border-color:#2E7D32;}
.radio-dot{width:9px;height:9px;border-radius:50%;background:#2E7D32;}
.check-box{width:18px;height:18px;border-radius:4px;border:2px solid #B0BEC5;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.check-box.on{background:#2E7D32;border-color:#2E7D32;color:#fff;}
.upload-zone{border:2px dashed #CFD8DC;border-radius:8px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:#FAFAFA;}
.upload-zone:hover{border-color:#2E7D32;}
.contact-fields{display:flex;flex-direction:column;gap:10px;}
.submit-wrap{padding:16px;flex-shrink:0;}
.submit-btn{display:block;width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;transition:opacity .15s;}
.submit-btn:hover{opacity:.9;}
.submit-note{text-align:center;font-size:12px;color:#90A4AE;margin-top:8px;line-height:1.6;}

/* ── 訂單追蹤 ── */
#view-orders{flex-direction:column;height:100vh;}
.orders-header{background:#1565C0;padding:16px 20px;padding-top:44px;display:flex;align-items:flex-end;gap:14px;flex-shrink:0;}
.orders-header h2{color:#fff;font-size:20px;font-weight:700;}
.orders-scroll{flex:1;overflow-y:auto;padding:16px;}
.order-card{background:#fff;border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.order-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.order-no{font-size:11px;color:#90A4AE;font-family:monospace;}
.order-title{font-size:15px;font-weight:600;color:#263238;margin-top:3px;}
.status-pill{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;}
.status-pill.pending{background:#FFF3E0;color:#E65100;}
.status-pill.processing{background:#E3F2FD;color:#1565C0;}
.status-pill.done{background:#E8F5E9;color:#2E7D32;}
.order-timeline{margin-top:12px;padding-left:16px;border-left:2px solid #ECEFF1;}
.tl-item{position:relative;padding-left:12px;margin-bottom:8px;}
.tl-item::before{content:'';position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:#2E7D32;border:2px solid #fff;box-shadow:0 0 0 1px #2E7D32;}
.tl-time{font-size:11px;color:#90A4AE;}
.tl-text{font-size:13px;color:#546E7A;margin-top:1px;}
.review-row{margin-top:12px;padding-top:12px;border-top:1px solid #ECEFF1;display:flex;align-items:center;justify-content:space-between;}
.stars{color:#F9A825;font-size:18px;letter-spacing:2px;}
.review-btn{background:#E8F5E9;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;color:#2E7D32;cursor:pointer;}

/* ── 成功畫面 ── */
#view-success{flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:32px;text-align:center;}
.success-icon{font-size:64px;margin-bottom:20px;}
.success-title{font-size:22px;font-weight:800;color:#2E7D32;margin-bottom:8px;}
.success-no{font-size:12px;color:#90A4AE;font-family:monospace;margin-bottom:16px;}
.success-desc{font-size:14px;color:#546E7A;line-height:1.7;margin-bottom:32px;}
.success-actions{display:flex;flex-direction:column;gap:10px;width:100%;}
.btn-solid{padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;}
.btn-outline{padding:14px;border:2px solid #2E7D32;border-radius:12px;font-size:15px;font-weight:700;background:#fff;color:#2E7D32;cursor:pointer;}

/* ── 底部 Tab ── */
.tab-bar{display:flex;background:#fff;border-top:1px solid #ECEFF1;flex-shrink:0;}
.tab-item{flex:1;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;cursor:pointer;font-size:10px;color:#90A4AE;font-weight:600;}
.tab-item.active{color:#2E7D32;}
.tab-icon{font-size:20px;}
</style>
</head>
<body>

<!-- ===== 登入畫面 ===== -->
<div id="view-login" class="view active">
  <div class="login-view">
    <div class="login-container">
      <div class="login-logo">
        <h1>Aî 智慧社區服務平台</h1>
        <p>— 智慧管家，一站搞定生活大小事 —</p>

        <button id="login-btn" class="login-btn">OpenPî / uniopen 一鍵授權登入</button>
        <ul class="login-features">
          <li>AI 智慧管家即時服務</li>
          <li>一站整合六大生活服務</li>
          <li>消費累積點數回饋</li>
        </ul>
      </div>
    </div>
  </div>
</div>

<!-- ===== 主控台畫面 ===== -->
<div id="view-dashboard" class="view">
  <div class="page-wrapper">
    <!-- Header -->
    <div class="page-header">
      <span id="header-title" class="header-title">嗨，住戶！AI 智慧管家在線上</span>
      <span id="points-text" class="header-action">50 P</span>
    </div>

    <!-- 頁面內容 -->
    <div class="page-content">
      <!-- 快捷服務 -->
      <h3 class="section-title">一站搞定生活大小事</h3>
      <div id="service-grid" class="service-grid"></div>

      <!-- AI 聊天 -->
      <div class="chat-section">
        <div id="chat-container" class="chat-container"></div>
        <div class="chat-input-bar">
          <input id="chat-input" type="text" placeholder="輸入您的生活需求... (例如：我想訂明天晚上的餐廳)">
          <button id="chat-send-btn" class="chat-send-btn">發送</button>
        </div>
      </div>
    </div>

    <!-- 底部導覽列 -->
    <nav class="nav-bar hidden">
      <a href="index.html" class="nav-item active">
        <span class="nav-icon">🏠</span>

      </a>
      <a href="services.html" class="nav-item">

        <span class="nav-icon">📋</span>

      </a>
      <a href="profile.html" class="nav-item">
        <span class="nav-icon">👤</span>

    </nav>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
