<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aî 智慧社區服務平台</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="view-login" class="view">
  <div class="login-container">
    <div class="logo-container">
      <h1 class="logo-text">Aî 智慧社區服務平台</h1>
      <p class="sub-text">— 智慧管家，一站搞定生活大小事 —</p>
    </div>

    <div class="card">
      <h2 class="card-title">使用 uniopen 帳號登入</h2>
      <p class="card-desc">整合零售、物流、餐飲、生活，單一帳號免切換 App。</p>
      <button id="login-btn" class="login-button">OpenPî / uniopen 一鍵授權登入</button>
    </div>
  </div>
</div>

<div id="view-dashboard" class="view hidden">
  <div class="dashboard-container">
    <div class="header">
      <span id="header-title" class="header-title">嗨，住戶！AI 智慧管家在線上</span>
      <span class="points-text">累積點數: 50 P</span>
    </div>

    <h3 class="section-title">一站搞定生活大小事</h3>
    <div id="service-grid" class="service-grid"></div>

    <div id="chat-container" class="chat-container"></div>

    <div class="input-container">
      <input id="chat-input" class="chat-input" type="text" placeholder="輸入您的生活需求... (例如：我想訂明天晚上的餐廳)">
      <button id="send-btn" class="send-button">發送</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
